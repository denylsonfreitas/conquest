<div class="flex min-h-dvh items-center justify-center bg-superficie-fundo p-4">
  <div class="cartao w-full max-w-sm p-8 shadow-sm">
    <h1 class="text-2xl font-semibold text-texto">Conquest</h1>

    <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="enviar()">
      <div>
        <label for="email" class="rotulo">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          class="campo mt-1"
        />
      </div>

      <div>
        <label for="senha" class="rotulo">Senha</label>
        <input
          id="senha"
          type="password"
          formControlName="senha"
          autocomplete="current-password"
          class="campo mt-1"
        />
      </div>

      @if (erro(); as mensagem) {
        <p role="alert" class="alerta-erro">{{ mensagem }}</p>
      }

      <button type="submit" class="btn w-full" [disabled]="enviando() || form.invalid">
        {{ enviando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
