<div class="min-h-dvh bg-tinta-50">
  <header class="border-b border-tinta-200 bg-white">
    <div class="mx-auto flex max-w-4xl items-center gap-6 px-4 py-3">
      <span class="text-lg font-semibold text-tinta-900">Conquest</span>

      <nav class="flex gap-1 text-sm">
        @for (item of navegacao; track item.rota) {
          <a
            [routerLink]="item.rota"
            routerLinkActive="bg-tinta-900 text-white hover:bg-tinta-900"
            class="rounded-campo px-3 py-1.5 text-tinta-500 transition hover:bg-tinta-50"
            >{{ item.rotulo }}</a
          >
        }
      </nav>

      <div class="ml-auto flex items-center gap-3">
        <span class="hidden text-sm text-tinta-500 sm:inline">{{ auth.email() }}</span>
        <button type="button" class="btn-secundario" (click)="sair()">Sair</button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-8">
    <router-outlet />
  </main>
</div>
