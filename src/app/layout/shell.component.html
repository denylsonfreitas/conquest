<div class="min-h-dvh bg-superficie-fundo">
  <header class="border-b border-borda bg-superficie">
    <div class="mx-auto flex max-w-4xl items-center gap-6 px-4 py-3">
      <span class="text-lg font-semibold text-texto">Conquest</span>

      <nav class="flex gap-1 text-sm">
        @for (item of navegacao; track item.rota) {
          <a
            [routerLink]="item.rota"
            routerLinkActive
            #rla="routerLinkActive"
            class="rounded-campo px-3 py-1.5 transition"
            [class]="
              rla.isActive
                ? 'bg-texto text-superficie'
                : 'text-texto-fraco hover:bg-superficie-sutil'
            "
            >{{ item.rotulo }}</a
          >
        }
      </nav>

      <div class="ml-auto flex items-center gap-3">
        <span class="hidden text-sm text-texto-fraco sm:inline">{{ auth.email() }}</span>
        <button
          type="button"
          class="btn-secundario"
          [attr.aria-label]="tema.tema() === 'claro' ? 'Ativar modo escuro' : 'Ativar modo claro'"
          (click)="tema.alternar()"
        >
          {{ tema.tema() === 'claro' ? '🌙' : '☀️' }}
        </button>
        <button type="button" class="btn-secundario" (click)="sair()">Sair</button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-8">
    <router-outlet />
  </main>
</div>
