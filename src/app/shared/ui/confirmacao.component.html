<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
  (click)="cancelar.emit()"
>
  <div
    role="alertdialog"
    aria-modal="true"
    class="cartao w-full max-w-md p-5 shadow-lg"
    (click)="$event.stopPropagation()"
  >
    <h2 class="font-semibold text-texto">{{ titulo() }}</h2>

    @if (consequencias().length > 0) {
      <p class="mt-3 text-sm text-texto">Isso também apaga:</p>
      <ul class="mt-1 space-y-0.5 text-sm">
        @for (c of consequencias(); track c) {
          <li class="font-medium text-perigo">{{ c }}</li>
        }
      </ul>
    }

    <p class="mt-3 text-sm text-texto-fraco">Não dá para desfazer.</p>

    <div class="mt-5 flex gap-2">
      <button type="button" class="btn-perigo" [disabled]="ocupado()" (click)="confirmar.emit()">
        {{ ocupado() ? 'Excluindo…' : rotuloConfirmar() }}
      </button>
      <button type="button" class="btn-secundario" [disabled]="ocupado()" (click)="cancelar.emit()">
        Cancelar
      </button>
    </div>
  </div>
</div>
