<div class="space-y-5">
  <div class="grid gap-4 sm:grid-cols-2">
    <div>
      <label for="filtro-banca" class="rotulo">Banca</label>
      <select
        id="filtro-banca"
        class="campo mt-1"
        [ngModel]="filtros().bancaId"
        (ngModelChange)="escolherBanca($event)"
      >
        <option [ngValue]="null">Todas</option>
        @for (b of opcoes().bancas; track b.id) {
          <option [ngValue]="b.id">{{ b.nome }}</option>
        }
      </select>
    </div>

    <div>
      <label for="filtro-concurso" class="rotulo">Concurso</label>
      <select
        id="filtro-concurso"
        class="campo mt-1"
        [ngModel]="filtros().concursoId"
        (ngModelChange)="escolherConcurso($event)"
      >
        <option [ngValue]="null">Todos</option>
        @for (c of opcoes().concursos; track c.id) {
          <option [ngValue]="c.id">{{ c.nome }}</option>
        }
      </select>
    </div>
  </div>

  <!--
    Matéria é multi-seleção; banca e concurso, não (docs/03).

    Recolhido num <details> em vez de chips soltos: com dezenas de matérias os
    chips viram várias linhas e empurram a tela inteira. Fechado ocupa uma
    linha e diz quantas estão ativas; aberto mostra TODAS as do recorte, que é
    o que o filtro precisa oferecer.

    <details> nativo de propósito — abre, fecha e navega por teclado sem
    JavaScript nenhum, e não precisa de clique-fora para fechar.
  -->
  <div>
    <span class="rotulo">Matérias</span>

    <!--
      `relative` no container e `absolute` na lista: ela flutua por cima do
      resto em vez de empurrar a tela, que é como os selects de banca e
      concurso se comportam. Empurrar é justamente o que fazia os chips
      atrapalharem.
    -->
    <details class="group relative mt-1">
      <summary class="campo flex cursor-pointer list-none items-center gap-2">
        <span class="flex-1" [class.text-texto-fraco]="filtros().materiaIds.length === 0">
          {{ resumoMaterias() }}
        </span>
        <span class="text-texto-fraco transition group-open:rotate-180">
          <app-icone nome="abrir" />
        </span>
      </summary>

      <div
        class="absolute z-20 mt-1 max-h-64 w-full overflow-y-auto rounded-campo border border-borda bg-superficie py-1 shadow-lg"
      >
        @for (m of opcoes().materias; track m.id) {
          <!--
            Linha inteira clicável, com a marca à esquerda: é a forma de lista
            de opções, e o alvo grande importa no tablet.
          -->
          <button
            type="button"
            class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm transition hover:bg-superficie-sutil"
            [class]="materiaEscolhida(m.id) ? 'text-texto' : 'text-texto-fraco'"
            (click)="alternarMateria(m.id)"
          >
            <span class="w-4 shrink-0 text-texto">
              @if (materiaEscolhida(m.id)) {
                <app-icone nome="aprovar" [tamanho]="14" />
              }
            </span>
            {{ m.nome }}
          </button>
        }
      </div>
    </details>
  </div>

  @if (tem()) {
    <button type="button" class="acao-inline" (click)="limpar()">Limpar filtros</button>
  }
</div>
