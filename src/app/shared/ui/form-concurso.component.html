<form class="space-y-4" [formGroup]="form" (ngSubmit)="enviar()">
  <div>
    <label for="concurso-nome" class="rotulo">Nome</label>
    <input
      id="concurso-nome"
      class="campo mt-1"
      formControlName="nome"
      placeholder="TRT 15ª Região"
    />
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div>
      <label for="concurso-orgao" class="rotulo">
        Órgão <span class="text-texto-fraco">(opcional)</span>
      </label>
      <input id="concurso-orgao" class="campo mt-1" formControlName="orgao" placeholder="TRT15" />
    </div>

    <div>
      <label for="concurso-banca" class="rotulo">Banca</label>
      <select id="concurso-banca" class="campo mt-1" formControlName="banca_id">
        <option value="">Sem banca definida</option>
        @for (banca of bancas(); track banca.id) {
          <option [value]="banca.id">{{ banca.nome }}</option>
        }
      </select>
    </div>
  </div>

  @if (bancaTrocada()) {
    <p role="status" class="rounded-campo bg-atencao-fundo px-3 py-2 text-sm text-atencao">
      Trocar a banca reclassifica as questões deste concurso nos filtros e no progresso.
    </p>
  }

  @if (erro(); as msg) {
    <p role="alert" class="alerta-erro">{{ msg }}</p>
  }

  <div class="flex gap-2">
    <button type="submit" class="btn" [disabled]="form.invalid || salvando()">
      {{ salvando() ? 'Salvando...' : rotuloSalvar() }}
    </button>
    <button type="button" class="btn-secundario" [disabled]="salvando()" (click)="cancelar.emit()">
      Cancelar
    </button>
  </div>
</form>
